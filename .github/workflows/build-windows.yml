---
# Builds the Windows installer for this fork (Apollo + virtual Wacom tablet forwarding).
# Upstream Apollo ships without CI; this follows docs/building.md and LizardByte/Sunshine's ci-windows.yml.
name: Build Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nlohmann-json

      # The exact toolchain of the last known-good build (2026-11-19): every compiler, tool and
      # library MSYS2 installed for it. MSYS2 updates its packages between builds, and twice in one
      # week that broke the build on its own (CMake 4.5 rejected Boost's CMake files; OpenSSL 4.1
      # made structures private). Updating the toolchain is now a change of its own: refresh this
      # list from the package list in a good build's log. CMake stays at 4.4.5 (4.5 rejects the
      # Boost 1.89 files the build fetches).
      - name: Pin toolchain
        run: |
          base=https://repo.msys2.org/mingw/ucrt64
          pacman -U --noconfirm --needed             $base/mingw-w64-ucrt-x86_64-MinHook-1.3.4-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-binutils-2.47-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-boost-1.92.0-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-boost-libs-1.92.0-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-brotli-1.2.1-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-bzip2-1.0.8-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-cc-libs-16.2.0-7-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-cmake-4.4.5-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-cppdap-1.65.r11.g6464cd7-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-cppwinrt-3.0.260818.1-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-crt-14.0.0.r598.ge3d18511f-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-curl-winssl-8.23.0-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-expat-2.10.0-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-gcc-16.2.0-7-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-gdb-18.1-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-gettext-runtime-1.0-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-gmp-6.3.0-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-headers-14.0.0.r598.ge3d18511f-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-icu-78.3-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-isl-0.28-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-jsoncpp-1.9.8-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libarchive-3.8.11-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libb2-0.98.1-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libffi-3.8.1-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libgcc-16.2.0-7-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libgomp-16.2.0-7-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libiconv-1.19.1-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libidn2-2.3.8-5-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libpsl-0.21.5-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libquadmath-16.2.0-7-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libssh2-wincng-1.11.1-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libstdc++-16.2.0-7-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libsystre-1.0.2-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libtre-0.9.0-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libunistring-1.4.2-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libuv-1.53.0-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libvpl-2.17.0-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-libwinpthread-14.0.0.r598.ge3d18511f-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-lz4-1.11.1-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-miniupnpc-2.3.3-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-mpc-1.4.1-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-mpdecimal-4.0.1-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-mpfr-4.2.2-3-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-ncurses-6.6-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-ninja-1.13.2-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-nlohmann-json-3.12.0-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-nsis-3.13-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-openssl-4.1.0-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-opus-1.6.1-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-pcre2-10.49-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-pkgconf-1~3.0.11-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-python-3.14.10-4-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-readline-8.3.003-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-rhash-1.4.6-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-sqlite-3.54.1-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-tcl-8.6.18-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-termcap-1.3.1-8-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-tk-8.6.18-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-tzdata-2026f-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-windows-default-manifest-20260815-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-wineditline-2.208-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-winpthreads-14.0.0.r598.ge3d18511f-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-xxhash-0.8.4-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-xz-5.8.4-1-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-zlib-1.4-2-any.pkg.tar.zst \n            $base/mingw-w64-ucrt-x86_64-zstd-1.5.7-2-any.pkg.tar.zst

      # The virtual tablet's own tests, against the real virtual_tablet.cpp: the USB/IP device,
      # the Wacom driver's handshake, the pen reports (seconds; no driver or tablet needed)
      - name: Build virtual tablet tests
        working-directory: tests/virtual_tablet
        run: g++ -std=gnu++23 -O1 -Wall -Wextra -static -I stub -I ../../src/platform/windows test_vt.cpp -o test_vt.exe -lws2_32

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run virtual tablet tests
        shell: pwsh
        working-directory: tests/virtual_tablet
        run: |
          $server = Start-Process -FilePath .	est_vt.exe -ArgumentList 'serve','intuos','45' -PassThru -RedirectStandardError serve.log
          Start-Sleep -Seconds 2
          python vt_client.py intuos
          $code = $LASTEXITCODE
          if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          Get-Content serve.log
          exit $code

      # Official Node.js, not MSYS2's (see docs/building.md)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Node.js path
        shell: pwsh
        run: |
          $NODEJS_PATH = Split-Path -Path (Get-Command node).Source -Parent
          echo "NODEJS_PATH=$NODEJS_PATH" >> $env:GITHUB_ENV

      # The virtual display driver binary and its installer tool aren't in git (*.dll/*.exe
      # are ignored upstream); take them from the official Apollo 0.4.6 installer, whose
      # SudoVDA.inf/.cat are the ones in this repo. Pinned by hash.
      - name: SudoVDA driver files
        shell: pwsh
        run: |
          $url = "https://github.com/ClassicOldSong/Apollo/releases/download/v0.4.6/Apollo-0.4.6.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\apollo-official.exe"
          & "C:\Program Files\7-Zip\7z.exe" x -y "-o$env:RUNNER_TEMP\apollo-official" "$env:RUNNER_TEMP\apollo-official.exe" "drivers\sudovda\SudoVDA.dll" "drivers\sudovda\nefconc.exe"
          $src = "$env:RUNNER_TEMP\apollo-official\drivers\sudovda"
          $expected = @{
            "SudoVDA.dll" = "47EE263CB5DE9382C6630A2D7F3DAFEC4A49419F953BEEC869CA5DD0C460FF63"
            "nefconc.exe" = "9DBA1F1A9E2B21843C4A0CA6C6FFA9E747250DD6E42C8C14325CA069AD43EA8F"
          }
          foreach ($file in $expected.Keys) {
            $hash = (Get-FileHash "$src\$file" -Algorithm SHA256).Hash
            if ($hash -ne $expected[$file]) { throw "$file hash mismatch: $hash" }
            Copy-Item "$src\$file" "src_assets\windows\drivers\sudovda\$file"
          }
          Get-ChildItem src_assets\windows\drivers\sudovda

      - name: Build
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          # Upstream 0.4.6 + this fork's changes; without it the build reports 0.0.0
          BUILD_VERSION: '0.4.10.20'
        run: |
          export PATH="$PATH:$(cygpath "$NODEJS_PATH")"
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/${GITHUB_REPOSITORY}" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/${GITHUB_REPOSITORY}/issues"
          ninja -C build

      - name: Package
        run: |
          cd build
          cpack -G NSIS
          cpack -G ZIP
          ls -la cpack_artifacts

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-vwacom-windows-${{ github.sha }}
          path: |
            build/cpack_artifacts/*.exe
            build/cpack_artifacts/*.zip
          if-no-files-found: error
